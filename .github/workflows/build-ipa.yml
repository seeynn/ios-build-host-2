name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LegacyIIiOS.xcodeproj \
            -scheme LegacyIIiOS

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          rm -rf build Payload LegacyII-iPhone-unsigned.ipa
          xcodebuild \
            -project LegacyIIiOS.xcodeproj \
            -scheme LegacyIIiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP='build/Build/Products/Release-iphoneos/LegacyIIiOS.app'
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry LegacyII-iPhone-unsigned.ipa Payload
          shasum -a 256 LegacyII-iPhone-unsigned.ipa > LegacyII-iPhone-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LegacyII-iPhone-unsigned-IPA
          path: |
            LegacyII-iPhone-unsigned.ipa
            LegacyII-iPhone-unsigned.ipa.sha256
            xcodebuild.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
